name: RENOVA Finanças Corrigir Rolagem Chat IA

on:
  push:
    paths:
      - 'scripts/corrigir_rolagem_chat_ia.py'
      - '.github/workflows/corrigir_rolagem_chat_ia.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar rolagem interna do chat
        run: python scripts/corrigir_rolagem_chat_ia.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar rolagem independente
        run: |
          grep -q 'overflow-y:scroll!important' app.py
          grep -q 'overscroll-behavior-y:contain!important' app.py
          grep -q 'scrollbar-gutter:stable!important' app.py
          grep -q -- '-webkit-overflow-scrolling:touch!important' app.py
      - name: Publicar correção
        run: |
          if git diff --quiet; then
            echo 'Nenhuma alteração pendente.'
            exit 0
          fi
          git config user.name 'RENOVA Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add app.py
          git commit -m 'fix(ui): adicionar rolagem independente na conversa da RENOVA IA'
          git push
