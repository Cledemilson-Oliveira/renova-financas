name: Apply free AI tier patch

on:
  push:
    branches: [feat/ia-padrao-gratuita-2026-09-11]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/ia-padrao-gratuita-2026-09-11
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply tier patch
        run: python scripts/patch_free_ai_tier.py
      - name: Validate syntax
        run: |
          git diff --check
          python -m compileall -q app.py src pages
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pages/Treinamento_IA.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(ia): liberar IA padrão no plano gratuito"
          git push origin HEAD:feat/ia-padrao-gratuita-2026-09-11
