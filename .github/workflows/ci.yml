name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app.py src pages
      - name: Import modules
        run: python -c "import src.access_control, src.data, src.repository, src.supabase_client, src.theme, src.ai_training_runtime, src.training_ingest"
      - name: Validate AI training runtime
        run: python -c "import src.ai_finance as m; assert getattr(m, '_renova_training_runtime_installed', False), 'Treinamento da IA não conectado ao processador'"
